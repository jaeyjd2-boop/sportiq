databases:
  - name: sportiq-db
    databaseName: sportiq
    user: sportiq
    plan: basic-256mb
    region: singapore

services:
  - type: web
    name: sportiq-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /bin/sh /app/scripts/start-api.sh
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sportiq-db
          property: connectionString
      - key: FOOTBALL_DATA_TOKEN
        sync: false
      - key: CORS_ORIGINS
        value: https://magnificent-taco-angel.wpcomstaging.com
      - key: LIVE_POLL_SECONDS
        value: "600"
      - key: FIXTURE_LOOKAHEAD_DAYS
        value: "2"
      - key: WEB_BACKFILL_ENABLED
        value: "false"
      - key: WEB_BACKFILL_COMPETITION
        value: "PL"

  - type: worker
    name: sportiq-collector
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /bin/sh /app/scripts/start-worker.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sportiq-db
          property: connectionString
      - key: FOOTBALL_DATA_TOKEN
        sync: false
      - key: LIVE_POLL_SECONDS
        value: "600"
      - key: FIXTURE_LOOKAHEAD_DAYS
        value: "2"
